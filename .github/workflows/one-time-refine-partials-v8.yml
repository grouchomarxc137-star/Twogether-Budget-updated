name: Refine partial expense flow v8

on:
  push:
    paths:
      - '.github/workflows/one-time-refine-partials-v8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refinement
        run: python maintenance/refine_partial_expense_flow_v8.py
      - name: Validate JavaScript
        run: node --check workflow.js
      - name: Commit validated refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine partial expense logging flow"
          git push
