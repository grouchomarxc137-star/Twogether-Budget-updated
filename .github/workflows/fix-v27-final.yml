name: Apply final v27 fixes
on:
  push:
    branches: [feature-v27-wishlist-twos-compare-impl]
    paths:
      - '.github/workflows/fix-v27-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v27-wishlist-twos-compare-impl
      - run: python scripts/fix-v27-final.py
      - run: |
          git config user.name "GrimReaper29"
          git config user.email "actions@users.noreply.github.com"
          git add v27.css backend/Code.gs backend/Code-v17.gs
          git diff --cached --quiet && exit 0
          git commit -m "Finalize v27 DEV hiding and compare persistence"
          git push origin HEAD:feature-v27-wishlist-twos-compare-impl
