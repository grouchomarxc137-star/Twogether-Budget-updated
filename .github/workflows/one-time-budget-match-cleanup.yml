name: Apply Twogether budget and match cleanup

on:
  push:
    paths:
      - 'maintenance/apply_budget_match_cleanup.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused frontend patch
        run: python maintenance/apply_budget_match_cleanup.py
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js live.css index.html
          git diff --cached --quiet || git commit -m "Refine budget cards and matching flow"
          git push
