name: Patch v28 Current Trip compactness
on:
  push:
    branches: [feature-v28-balance-wishlist-layout-final2]
    paths: ['.github/workflows/patch-v28-card.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove nested card padding and tighten outer spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v28.css')
          s=p.read_text()
          s=s.replace('padding:15px 16px 11px!important;','padding:12px 14px 9px!important;',1)
          needle='#twCurrentTripsSection.v27-current-side .tw-current-card h3{font-size:24px!important;font-weight:500!important;margin:5px 0 2px!important}'
          repl='#twCurrentTripsSection.v27-current-side .tw-current-main{padding:0!important}\n'+needle
          if '#twCurrentTripsSection.v27-current-side .tw-current-main{padding:0!important}' not in s:
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
          git config user.name 'GrimReaper29'
          git config user.email 'anokasptnestle@gmail.com'
          git add v28.css
          git commit -m 'Finish compact Current Trips layout for v28'
          git push
