name: Validate v12 refinement
on:
  push:
    branches:
      - feature-v12-dev-current-trips
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check refine-v10.js
          node --check refine-v11.js
          node --check refine-v12.js
          node --check workflow.js
          node --check app.js
      - name: Check v12 assets are loaded
        run: |
          grep -q 'refine-v12.css' index.html
          grep -q 'refine-v12.js' index.html
