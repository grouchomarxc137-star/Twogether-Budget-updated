name: Finalize finance v10

on:
  push:
    branches:
      - finance-v10-test
    paths:
      - '.github/workflows/one-time-finance-v10-final.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final fixes
        run: python maintenance/finalize_finance_v10.py
      - name: Validate
        run: |
          node --check finances.js
          node --check navigation.js
          cp backend/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          grep -q 'version:14' backend/Code.gs
          grep -q 'Purchase + Monthly cost' finances.js
      - name: Commit final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/Code.gs navigation.css
          git diff --cached --quiet && exit 0
          git commit -m "Finalize finance v10 compatibility"
          git push
