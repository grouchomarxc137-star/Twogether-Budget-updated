name: Fix partial expense ordering and persistence v9

on:
  push:
    paths:
      - '.github/workflows/one-time-partial-v9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python maintenance/fix_partial_order_and_persistence_v9.py
      - name: Validate JavaScript
        run: node --check workflow.js
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix partial expense ordering and saved totals"
          git push
