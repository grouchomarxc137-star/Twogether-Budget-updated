name: Stay Tracker verification
on:
  push:
    branches: [test]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - name: Focused Stay Tracker tests
        run: node --test server/test/stay-tracker.test.js server/test/stay-search-links.test.js server/test/stays.test.js
      - name: Full existing test suite
        run: npm test
        continue-on-error: true
      - name: Production build
        run: npm run build
