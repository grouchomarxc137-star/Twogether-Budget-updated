name: Apply finance refinement

on:
  push:
    branches:
      - feature-finance-refine

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-finance-refine
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply refinements
        run: python .tools/apply_finance_refine.py
      - name: Validate JavaScript and UI hooks
        run: |
          node --check ui.js
          node --check wishlist.js
          node --check navigation.js
          grep -q 'Plan another trip budget' ui.js
          grep -q 'wishlist-table' wishlist.js
          grep -q 'Open link' wishlist.js
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ui.js wishlist.js wishlist.css finance.css
          if ! git diff --cached --quiet; then
            git commit -m 'Refine finance subpages, wishlist table, and multi-budget planning [skip ci]'
            git push origin HEAD:feature-finance-refine
          fi
