name: Validate approved v18
on:
  push:
    branches:
      - feature-v18-approved-batch
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript, assets and backend
        run: node tests/validate.cjs
      - name: Test backend payment and confirmation rules
        run: node tests/backend.cjs
      - name: Check approved v18 assets and rollback safety
        run: |
          node --check approved-v18.js
          node --check dev-v18.js
          node --check shared.js
          node --check trip-wizard-bridge-v15.js
          grep -q 'approved-v18.css?v=1' index.html
          grep -q 'dev-v18.js?v=1' index.html
          grep -q 'approved-v18.js?v=1' index.html
          ! grep -q 'refine-v10.js' index.html
          ! grep -q 'refine-v11.js' index.html
          ! grep -q 'refine-v12.js' index.html
          ! grep -q 'playground.js' index.html
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run approved v18 browser regression
        run: node tests/browser-v18.cjs
