name: Recover Twogether live site

on:
  push:
    paths:
      - '.github/workflows/one-time-recover-live.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known-good live files
        run: |
          git checkout 6270fc446870bb56a2d8e8ca31c0c0a6bdc70028 -- workflow.js live.css index.html
      - name: Commit recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js live.css index.html
          git diff --cached --quiet || git commit -m "Recover last known-good Twogether build"
          git push
