name: Apply Extra budget limit v13

on:
  push:
    branches:
      - finance-extra-budget-fix-test
    paths:
      - '.github/workflows/one-time-extra-budget-limit-v13.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Extra budget ceiling patch
        run: python maintenance/apply_extra_budget_limit_v13.py
      - name: Validate frontend JavaScript
        run: node --check finances.js
      - name: Validate Apps Script syntax
        run: |
          cp backend/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finances.js index.html backend/Code.gs
          git diff --cached --quiet && exit 0
          git commit -m "Treat Extra 250 as monthly spending limit"
          git push
