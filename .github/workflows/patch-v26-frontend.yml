name: Patch v26 frontend
on:
  push:
    branches: [feature-v26-twos-scoreboard-design]
    paths: ['.github/workflows/patch-v26-frontend.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v26-twos-scoreboard-design
          fetch-depth: 0
      - run: python3 scripts/patch-v26-frontend.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load v26 shop and overview"
          git push origin HEAD:feature-v26-twos-scoreboard-design
