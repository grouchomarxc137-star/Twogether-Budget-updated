name: Fix partial actuals UI compatibility

on:
  push:
    paths:
      - 'maintenance/fix_partial_ui_compat.py'
      - '.github/workflows/one-time-fix-partial-ui-compat.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compatibility patch
        run: python maintenance/fix_partial_ui_compat.py
      - name: Validate UI JavaScript syntax
        run: node --check ui.js
      - name: Commit validated UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui.js index.html
          git diff --cached --quiet || git commit -m "Keep partial expense locks and confirmed budget details consistent"
          git push
