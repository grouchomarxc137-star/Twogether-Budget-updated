name: Validate v14 shared expenses
on:
  push:
    branches:
      - feature-v14-shared-expenses
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend JavaScript syntax
        run: |
          node --check fast-start.js
          node --check shared-expenses-v14.js
          node --check refine-v10.js
          node --check refine-v11.js
          node --check refine-v12.js
          node --check workflow.js
          node --check app.js
      - name: Check Apps Script syntax as JavaScript
        run: node --check backend/Code-v16.gs
      - name: Check new assets exist
        run: |
          test -f shared-expenses-v14.css
          test -f shared-expenses-v14.js
          grep -q 'shared-expenses-v14.js' fast-start.js
