name: Validate v31 mobile visual refinement
on:
  push:
    branches:
      - feature-v31-mobile-visual-refine
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and backend regression checks
        run: |
          node --check v29.js
          node --check v31.js
          node tests/validate.cjs
          node tests/backend.cjs
          node tests/game-v27.cjs
          grep -q 'v31.css?v=1' index.html
          grep -q 'v31.js?v=1' index.html
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Existing v30 browser regression
        run: node tests/browser-v30.cjs
      - name: v31 browser and mobile regression
        run: node tests/browser-v31.cjs
