name: Validate v33 PWA Jar finance and checklists
on:
  push:
    branches:
      - feature-v33-pwa-jar-finance-checklists
    paths-ignore:
      - '.github/workflows/apply-v33-*.yml'
      - 'scripts/apply-v33-*.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and backend regressions
        run: |
          node --check shared.js
          node --check v33.js
          node --check service-worker.js
          node tests/validate.cjs
          node tests/backend.cjs
          node tests/backend-v33.cjs
          node tests/game-v27.cjs
          cmp backend/Code.gs backend/Code-v17.gs
          grep -q 'manifest.webmanifest?v=1' index.html
          grep -q 'v33.css?v=1' index.html
          grep -q 'v33.js?v=1' index.html
          grep -q 'branches: \["main"\]' .github/workflows/pages.yml
          ! grep -q 'setInterval(()=>refreshState(false),5000)' approved-v18.js
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Existing v30 browser regression
        run: node tests/browser-v30.cjs
      - name: Existing v31 browser regression
        run: node tests/browser-v31.cjs
      - name: Existing v32 browser regression
        run: node tests/browser-v32.cjs
      - name: v33 browser regression
        run: node tests/browser-v33.cjs

# final-head-validation
