name: Clean Lonato trips

on:
  push:
    paths:
      - '.github/workflows/one-time-clean-lonato.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Lonato and Loanto trips
        shell: bash
        run: |
          set -euo pipefail
          URL='https://script.google.com/macros/s/AKfycbxwx7oh24EkBDCyWAshJZnVWgI9F0kpg3wjjfwKhdMuoWE1ifgwJ5hPRqD_9iULKcJjlg/exec'

          get_state() {
            curl -sS --retry 5 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 45 -L "$URL?action=state"
          }

          post_action() {
            local action="$1" payload="$2"
            local hdr body location
            hdr="$(mktemp)"; body="$(mktemp)"
            curl -sS --retry 4 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 45 \
              -D "$hdr" -o "$body" \
              --data-urlencode "action=$action" \
              --data-urlencode 'actor=Principessa' \
              --data-urlencode "payload=$payload" \
              "$URL"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/,""); sub(/\r$/,""); print}' "$hdr" | tail -1)"
            if [ -n "$location" ]; then
              curl -sS --retry 4 --retry-delay 2 --retry-all-errors --connect-timeout 10 --max-time 45 -L "$location"
            else
              cat "$body"
            fi
            rm -f "$hdr" "$body"
          }

          before="$(get_state)"
          echo "$before" > /tmp/state-before.json
          jq -e '.ok == true and (.state.trips|type)=="array"' /tmp/state-before.json >/dev/null

          mapfile -t ids < <(jq -r '.state.trips[]? | select((((.submissions.Principessa.city // .submissions.Principe.city // "") | ascii_downcase) | test("lonato|loanto"))) | .id' /tmp/state-before.json)
          echo "Found ${#ids[@]} Lonato/Loanto trip(s)."

          for id in "${ids[@]}"; do
            payload="$(jq -nc --arg id "$id" '{id:$id}')"
            result="$(post_action deleteTrip "$payload")"
            echo "Delete $id => $result"
          done

          sleep 2
          after="$(get_state)"
          echo "$after" > /tmp/state-after.json
          jq -e '.ok == true and (.state.trips|type)=="array"' /tmp/state-after.json >/dev/null
          remaining_bad="$(jq '[.state.trips[]? | select((((.submissions.Principessa.city // .submissions.Principe.city // "") | ascii_downcase) | test("lonato|loanto")))] | length' /tmp/state-after.json)"
          echo 'Remaining trip cities:'
          jq -r '.state.trips[]? | (.submissions.Principessa.city // .submissions.Principe.city // "(no city)")' /tmp/state-after.json
          test "$remaining_bad" -eq 0
