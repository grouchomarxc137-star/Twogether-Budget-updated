name: Deploy Twogether to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate current runtime
        run: |
          node --check api.js
          node --check trip-wizard-bridge-v15.js
          node --check service-worker.js
          node tests/validate.cjs
          node tests/backend.cjs
          node tests/backend-v33.cjs
          cmp backend/Code.gs backend/Code-v17.gs

      - name: Prepare only current runtime files
        run: |
          set -euo pipefail
          mkdir public
          files=(
            index.html manifest.webmanifest app-icon.svg service-worker.js
            config.js api.js fast-start.js app.js workflow.js ui.js finances.js navigation.js shared.js trip-wizard-bridge-v15.js
            approved-v18.js refine-v19.js overview-v26.js v27.js v28.js v29.js v31.js v32.js v33.js
            styles.css live.css finance.css navigation.css wishlist.css approved-v18.css refine-v19.css
            v27.css v28.css v29.css v29-mobile.css v30.css v31.css v31-floor.css v32.css v33.css
          )
          for file in "${files[@]}"; do
            test -f "$file"
            cp "$file" public/
          done
          echo "Publishing ${#files[@]} allowlisted runtime files."

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
