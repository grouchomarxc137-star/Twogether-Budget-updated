name: Validate v29 wizard, Wishlist and Shop
on:
  push:
    branches: [feature-v29-wizard-wishlist-shop]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and backend regression
        run: |
          node --check v27.js
          node --check v28.js
          node --check v29.js
          node --check workflow.js
          node tests/validate.cjs
          node tests/backend.cjs
          node tests/game-v27.cjs
          grep -q "v29.js?v=1" v28.js
          test -f v29.css
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
      - name: Existing v27 browser regression
        env:
          TWOGETHER_BROWSER: /usr/bin/google-chrome
        run: node tests/browser-v27.cjs
      - name: Existing v28 browser regression
        env:
          TWOGETHER_BROWSER: /usr/bin/google-chrome
        run: node tests/browser-v28.cjs
      - name: v29 browser regression
        env:
          TWOGETHER_BROWSER: /usr/bin/google-chrome
        run: node tests/browser-v29.cjs
