name: Apply v9 finance redesign

on:
  push:
    branches:
      - redesign-v9-test
    paths:
      - '.github/workflows/one-time-redesign-v9.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign patch
        run: python maintenance/apply_redesign_v9.py
      - name: Validate frontend JavaScript
        run: |
          node --check finances.js
          node --check workflow.js
          node --check navigation.js
      - name: Validate Apps Script syntax
        run: |
          cp backend/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Sanity checks
        run: |
          grep -q 'data-hub="trips"' index.html
          grep -q 'data-fin-subview="scenarios"' index.html
          grep -q "extraMainAsk" finances.js
          grep -q "repayments" finances.js
          grep -q "version: 13" backend/Code.gs
      - name: Commit validated redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html workflow.js finances.js backend/Code.gs
          git diff --cached --quiet && exit 0
          git commit -m "Redesign finance navigation and tracking"
          git push
