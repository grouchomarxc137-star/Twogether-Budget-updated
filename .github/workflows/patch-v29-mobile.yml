name: Patch v29 mobile containment
on:
  push:
    branches: [feature-v29-wizard-wishlist-shop]
    paths: ['.github/workflows/patch-v29-mobile.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep Wishlist and main navigation inside mobile viewport
        run: |
          cat >> v29.css <<'CSS'

/* v29 mobile containment: four main destinations remain usable without widening the page. */
@media(max-width:680px){
  .hub-tabs{max-width:100vw!important;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important;overscroll-behavior-x:contain!important}
  .hub-tabs::-webkit-scrollbar{display:none!important}
  .hub-tabs .hub-tab{flex:0 0 auto!important;white-space:nowrap!important}
  #financeWishlist,#financeWishlist .v27-wish-shell,#financeWishlist .v28-shop-layout,#financeWishlist .v28-collection,#financeWishlist .v27-wish-grid,#financeWishlist .v27-wish-card,#financeWishlist .v27-cart{min-width:0!important;max-width:100%!important;box-sizing:border-box!important}
  #financeWishlist .v27-wish-hero{padding:18px 16px!important;max-width:100%!important;box-sizing:border-box!important}
  #financeWishlist .v27-wish-actions,#financeWishlist .v28-filter-row{flex-wrap:wrap!important;min-width:0!important}
  #financeWishlist .v27-priority-filter{max-width:100%!important;min-width:0!important}
  #financeWishlist .v27-wish-card-actions{flex-wrap:wrap!important}
  #financeWishlist .v27-wish-card-actions button{min-width:0!important;max-width:100%!important}
  #financeWishlist .v28-wish-title,#financeWishlist .v28-wish-note,#financeWishlist .v28-wish-readiness{min-width:0!important;overflow-wrap:anywhere!important}
}
CSS
