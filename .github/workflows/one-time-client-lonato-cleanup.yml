name: Apply client Lonato cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-client-lonato-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup patch
        run: python maintenance/apply_client_lonato_cleanup.py
      - name: Validate JavaScript
        run: node --check workflow.js
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove Lonato trips from Twogether"
          git push
