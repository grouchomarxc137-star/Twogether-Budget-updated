name: Validate v32 Shop mobile and activity fixes
on:
  push:
    branches:
      - feature-v32-shop-mobile-activity-fix
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and backend regression checks
        run: |
          node --check v29.js
          node --check v31.js
          node --check v32.js
          node tests/validate.cjs
          node tests/backend.cjs
          node tests/game-v27.cjs
          grep -q 'v32.css?v=1' index.html
          grep -q 'v32.js?v=1' index.html
      - name: Install browser test dependency
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Existing v30 browser regression
        run: node tests/browser-v30.cjs
      - name: Existing v31 browser regression
        run: node tests/browser-v31.cjs
      - name: v32 browser regression
        run: node tests/browser-v32.cjs
