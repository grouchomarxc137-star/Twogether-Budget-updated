name: Apply guarded confirmed-budget cleanup

on:
  push:
    paths:
      - 'maintenance/apply_hide_confirmed_budgets.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply confirmed-budget cleanup
        run: python maintenance/apply_hide_confirmed_budgets.py
      - name: Validate JavaScript syntax
        run: node --check workflow.js
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js index.html
          git diff --cached --quiet || git commit -m "Hide confirmed trips from active budget planner"
          git push
