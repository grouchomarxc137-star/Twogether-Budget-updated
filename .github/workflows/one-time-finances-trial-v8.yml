name: Apply finances trial v8

on:
  push:
    paths:
      - '.github/workflows/one-time-finances-trial-v8.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python maintenance/apply_finances_trial_v8.py
      - name: Validate frontend JavaScript
        run: |
          node --check workflow.js
          node --check finances.js
      - name: Validate Apps Script syntax
        run: |
          cp backend/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js backend/Code.gs
          git diff --cached --quiet && exit 0
          git commit -m "Add personal monthly finances trial and last trip budget"
          git push
