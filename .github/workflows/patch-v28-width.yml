name: Patch v28 desktop workspace width
on:
  push:
    branches: [feature-v28-balance-wishlist-layout-final2]
    paths: ['.github/workflows/patch-v28-width.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep the 60/40 layout while satisfying compact desktop width
        run: |
          sed -i 's/max-width:1280px!important/max-width:1320px!important/' v28.css
          git config user.name 'GrimReaper29'
          git config user.email 'anokasptnestle@gmail.com'
          git add v28.css
          git commit -m 'Tune v28 wizard and Current Trips desktop balance'
          git push
