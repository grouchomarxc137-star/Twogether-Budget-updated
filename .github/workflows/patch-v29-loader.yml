name: Patch v29 loader
on:
  push:
    branches: [feature-v29-wizard-wishlist-shop]
    paths: ['.github/workflows/patch-v29-loader.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load v29 after v28
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v28.js')
          s=p.read_text()
          marker="function init(){installPackingCapture();refreshVisuals();"
          inject="function loadV29(){if(document.querySelector('script[src*=\\\"v29.js\\\"]'))return;const s=document.createElement('script');s.src='v29.js?v=1';s.defer=true;document.body.appendChild(s);}\nfunction init(){loadV29();installPackingCapture();refreshVisuals();"
          if marker not in s:
              raise SystemExit('v28 init marker not found')
          s=s.replace(marker,inject,1)
          p.write_text(s)
          PY
          git config user.name 'GrimReaper29'
          git config user.email 'anokasptnestle@gmail.com'
          git add v28.js
          git commit -m 'Load v29 polish after v28'
          git push
