name: Apply Twogether expense-loop patch

on:
  push:
    paths:
      - 'maintenance/apply_expense_loop.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused frontend patch
        run: python maintenance/apply_expense_loop.py
      - name: Commit patched runtimes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js workflow.js
          git diff --cached --quiet || git commit -m "Add repeatable other-expense entry flow"
          git push
