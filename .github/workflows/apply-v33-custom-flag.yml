name: Apply v33 planner actor-cache fix
on:
  push:
    branches: [feature-v33-pwa-jar-finance-checklists]
    paths: [.github/workflows/apply-v33-custom-flag.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v33-pwa-jar-finance-checklists
      - name: Reset monthly planner cache when profile changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v33.js');s=p.read_text()
          old="let planning=root._planning&&root.dataset.month===plannerMonth?root._planning:initialPlanning(plannerMonth);root._planning=planning;root.dataset.month=plannerMonth;"
          new="const activeActor=actor();let planning=root._planning&&root.dataset.month===plannerMonth&&root.dataset.actor===activeActor?root._planning:initialPlanning(plannerMonth);root._planning=planning;root.dataset.month=plannerMonth;root.dataset.actor=activeActor;"
          if old not in s: raise SystemExit('missing planner cache anchor')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify and commit planner cache fix
        run: |
          node --check v33.js
          grep -q 'root.dataset.actor===activeActor' v33.js
          git config user.name "GrimReaper29"
          git config user.email "actions@users.noreply.github.com"
          git add v33.js
          git commit -m "Reset finance planner cache when switching profiles"
          git push origin HEAD:feature-v33-pwa-jar-finance-checklists
