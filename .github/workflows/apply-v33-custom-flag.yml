name: Apply v33 planning metadata fix
on:
  push:
    branches: [feature-v33-pwa-jar-finance-checklists]
    paths: [.github/workflows/apply-v33-custom-flag.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v33-pwa-jar-finance-checklists
      - name: Remove deleted custom items from Actual records
        run: |
          python - <<'PY'
          from pathlib import Path
          old="""      const planning = sanitizeFinancePlanning_(payload.planning || {});\n      record.planning = planning;\n      planning.items.forEach(function(item){"""
          new="""      const previousPlanning = sanitizeFinancePlanning_(record.planning || {});\n      const planning = sanitizeFinancePlanning_(payload.planning || {});\n      const nextNames = planning.items.map(function(x){ return String(x.name || '').trim().toLowerCase(); });\n      previousPlanning.items.filter(function(x){ return x.custom === true && nextNames.indexOf(String(x.name || '').trim().toLowerCase()) < 0; }).forEach(function(item){\n        const removed = String(item.name || '').trim().toLowerCase();\n        record.incomes = (record.incomes || []).filter(function(x){ return String(x.name || '').trim().toLowerCase() !== removed; });\n        record.expenses = (record.expenses || []).filter(function(x){ return String(x.name || '').trim().toLowerCase() !== removed; });\n      });\n      record.planning = planning;\n      planning.items.forEach(function(item){"""
          for name in ['backend/Code.gs','backend/Code-v17.gs']:
            p=Path(name);s=p.read_text()
            if old not in s: raise SystemExit(name+' missing planning cleanup anchor')
            p.write_text(s.replace(old,new,1))
          PY
      - name: Verify and commit planning cleanup
        run: |
          cmp backend/Code.gs backend/Code-v17.gs
          grep -q "previousPlanning.items.filter" backend/Code.gs
          git config user.name "GrimReaper29"
          git config user.email "actions@users.noreply.github.com"
          git add backend/Code.gs backend/Code-v17.gs
          git commit -m "Remove deleted custom Actual finance rows"
          git push origin HEAD:feature-v33-pwa-jar-finance-checklists
