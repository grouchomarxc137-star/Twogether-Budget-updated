name: Validate v11 refinement
on:
  push:
    branches:
      - feature-v11-calm-nav-wishlist
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check refine-v10.js
          node --check refine-v11.js
          node --check navigation.js
          node --check wishlist.js
          node --check workflow.js
      - name: Check refinement files are loaded
        run: |
          grep -q 'refine-v11.css' index.html
          grep -q 'refine-v11.js' index.html
