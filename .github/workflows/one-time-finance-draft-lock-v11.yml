name: Apply finance draft/final v11

on:
  push:
    branches:
      - finance-draft-fix-test
    paths:
      - '.github/workflows/one-time-finance-draft-lock-v11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply finance draft/final patch
        run: python maintenance/apply_finance_draft_lock_v11.py
      - name: Validate frontend JavaScript
        run: node --check finances.js
      - name: Validate Apps Script syntax
        run: |
          cp backend/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finances.js finance.css index.html backend/Code.gs
          git diff --cached --quiet && exit 0
          git commit -m "Fix Extra budget and add finance drafts"
          git push
