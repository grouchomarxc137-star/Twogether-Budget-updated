name: Apply v33 app shell and optimization
on:
  push:
    branches:
      - feature-v33-pwa-jar-finance-checklists
    paths:
      - .github/workflows/apply-v33-shell.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v33-pwa-jar-finance-checklists
      - name: Apply shell patch
        run: python scripts/apply-v33-shell.py
      - name: Check syntax and references
        run: |
          node --check v33.js
          node -e "const fs=require('fs'),vm=require('vm');new vm.Script(fs.readFileSync('backend/Code.gs','utf8'))"
          cmp backend/Code.gs backend/Code-v17.gs
          grep -q 'manifest.webmanifest?v=1' index.html
          grep -q 'v33.css?v=1' index.html
          grep -q 'v33.js?v=1' index.html
          grep -q '\*.webmanifest \*.svg' .github/workflows/pages.yml
          ! grep -q 'setInterval(()=>refreshState(false),5000)' approved-v18.js
      - name: Commit shell patch
        run: |
          git config user.name "GrimReaper29"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/pages.yml approved-v18.js backend/Code.gs backend/Code-v17.gs
          git commit -m "Wire PWA assets and reduce legacy polling"
          git push origin HEAD:feature-v33-pwa-jar-finance-checklists
