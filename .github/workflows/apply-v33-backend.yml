name: Apply v33 backend additions
on:
  push:
    branches:
      - feature-v33-pwa-jar-finance-checklists
    paths:
      - .github/workflows/apply-v33-backend.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v33-pwa-jar-finance-checklists
      - name: Correct helper anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-v33-backend.py')
          s=p.read_text()
          s=s.replace("warnings.push('Total payments do not match trip expenses (difference €'+Math.abs(total-paid).toFixed(2)+'.');}","warnings.push('Total payments do not match trip expenses (difference €'+Math.abs(total-paid).toFixed(2)+').');}")
          p.write_text(s)
          PY
      - name: Apply additive backend patch
        run: python scripts/apply-v33-backend.py
      - name: Verify backend copies
        run: |
          node --check backend/Code.gs
          cmp backend/Code.gs backend/Code-v17.gs
          grep -q "saveAccommodationExpense" backend/Code.gs
          grep -q "saveFinancePlanning" backend/Code.gs
          grep -q "saveTripPrep" backend/Code.gs
      - name: Commit backend patch
        run: |
          git config user.name "GrimReaper29"
          git config user.email "actions@users.noreply.github.com"
          git add backend/Code.gs backend/Code-v17.gs
          git commit -m "Add shared Jar finance planning and trip prep backend"
          git push origin HEAD:feature-v33-pwa-jar-finance-checklists
