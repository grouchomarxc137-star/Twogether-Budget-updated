name: Patch v29 navigation tests
on:
  push:
    branches: [feature-v29-wizard-wishlist-shop]
    paths: ['.github/workflows/patch-v29-tests.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update legacy Wishlist navigation expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          old="document.querySelector('.finance-subnav [data-fin-subview=\"wishlist\"]').click()"
          new="document.querySelector('#wishlistHub').click()"
          for name in ['tests/browser-v27.cjs','tests/browser-v28.cjs']:
              p=Path(name);s=p.read_text()
              if old not in s: raise SystemExit(f'Wishlist navigation marker not found in {name}')
              p.write_text(s.replace(old,new))
          PY
          git config user.name 'GrimReaper29'
          git config user.email 'anokasptnestle@gmail.com'
          git add tests/browser-v27.cjs tests/browser-v28.cjs
          git commit -m 'Update Wishlist browser tests for main navigation'
          git push
