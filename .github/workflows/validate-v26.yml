name: Validate v26 Twos and trip design
on:
  push:
    branches: [feature-v26-twos-scoreboard-design]
    paths:
      - '.github/workflows/validate-v26.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and regression checks
        run: |
          node --check shop-v26.js
          node --check overview-v26.js
          node --check refine-v19.js
          node --check refine-v22.js
          node --check trip-v21.js
          node tests/validate.cjs
          node tests/backend.cjs
          node tests/game-v26.cjs
          node tests/shop-v26.cjs
      - name: Browser regression
        env:
          TWOGETHER_BROWSER: /usr/bin/google-chrome
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          node tests/browser-v26.cjs
# rerun after flying message click-target fix
