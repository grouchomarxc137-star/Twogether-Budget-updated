name: Fix v27 browser assertion
on:
  push:
    branches: [feature-v27-wishlist-twos-compare-impl]
    paths: ['.github/workflows/fix-v27-test.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix case-insensitive Wishlist wallet assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/browser-v27.cjs')
          s=p.read_text()
          old="assert.match(await wish.innerText(),/Available Twos/);"
          new="assert.match(await wish.innerText(),/Available Twos/i);"
          if old not in s:
              raise SystemExit('target assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name 'GrimReaper29'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/browser-v27.cjs
          git commit -m 'Fix v27 Wishlist wallet browser assertion'
          git push
