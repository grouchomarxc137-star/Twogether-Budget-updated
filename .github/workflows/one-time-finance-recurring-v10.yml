name: Apply recurring finance v10

on:
  push:
    paths:
      - '.github/workflows/one-time-finance-recurring-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply recurring finance patch
        run: python maintenance/apply_finance_recurring_v10.py
      - name: Validate finance JavaScript
        run: node --check finances.js
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finances.js finance.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add recurring monthly finance checklist"
          git push
