name: Validate v22 DEV/wishlist/navigation
on:
  push:
    branches: [feature-v22-free-dev-wishlist]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and asset checks
        run: |
          node --check dev-v22b.js
          node --check dev-v22c.js
          node --check dev-v22d.js
          node --check dev-v22e.js
          node --check dev-v22-observer.js
          node --check refine-v22.js
          node --check refine-v19.js
          node --check wishlist.js
          grep -q 'refine-v22.css?v=1' refine-v19.js
          grep -q 'refine-v22c.css?v=1' refine-v19.js
          grep -q 'refine-v22.js?v=2' refine-v19.js
          grep -q 'dev-v22b.js?v=1' refine-v19.js
          grep -q 'dev-v22-observer.js?v=2' refine-v19.js
          grep -q 'dev-v22c.js?v=4' refine-v19.js
          grep -q 'dev-v22d.js?v=1' refine-v19.js
          grep -q 'dev-v22e.js?v=1' refine-v19.js
          node tests/validate.cjs
      - name: Backend regression
        run: node tests/backend.cjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser regression
        run: node tests/browser-v22.cjs