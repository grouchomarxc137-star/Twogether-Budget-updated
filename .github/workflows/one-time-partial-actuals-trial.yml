name: Apply guarded partial-actuals trial

on:
  push:
    paths:
      - 'maintenance/apply_partial_actuals_trial.py'
      - '.github/workflows/one-time-partial-actuals-trial.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply partial actual-expense trial
        run: python maintenance/apply_partial_actuals_trial.py
      - name: Validate frontend JavaScript syntax
        run: node --check workflow.js
      - name: Validate Apps Script syntax
        run: cp backend/Code.gs /tmp/twogether-backend.js && node --check /tmp/twogether-backend.js
      - name: Commit validated trial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow.js backend/Code.gs index.html
          git diff --cached --quiet || git commit -m "Add partial actual-expense logging trial"
          git push
